
workflows:
  criw-cicio-ios:
    name: Criw Cicio iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Criw Cicio

    environment:
      node: v22.11.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.criwcicio.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Synchronise Capacitor
        script: npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build signed iOS app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
