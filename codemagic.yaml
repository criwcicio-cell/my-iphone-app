workflows:
  criw-cicio-ios:
    name: Criw Cicio iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: v22.11.0
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Synchronise Capacitor
        script: npx cap sync ios

      - name: Build iPhone app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
